# Legacy Worker service name kept to avoid creating a new production Worker during rename cleanup.
name = "cfchat"
main = "worker/src/index.js"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
MESSAGE_RETENTION_DAYS = "7"
SOFT_DELETE_RETENTION_DAYS = "60"
GC_BATCH_SIZE = "500"
GC_MAX_BATCHES_PER_RUN = "20"
R2_DELETE_MAX_RETRY = "8"
ALLOWED_FILE_TYPES = "image/,video/,audio/,application/pdf,text/"
MAX_FILE_SIZE = "20971520"

# 内置"熙熙账号"OAuth 注册配置（使用 secrets 管理敏感值：wrangler secret put CLIENT_SECRET）
# CLIENT_ID = "your-oauth-client-id"
# AUTH_ENDPOINT = "https://auth.cuixi.qzz.io"
# TOKEN_ENDPOINT = "https://xi-auth.pages.dev/oauth/token"
# USERINFO_ENDPOINT = "https://xi-auth.pages.dev/oauth/userinfo"
# REDIRECT_URI = "https://你的站点域名/register-oauth"
# CLIENT_SECRET 通过 `wrangler secret put CLIENT_SECRET` 设置

[[d1_databases]]
binding = "DB"
# Legacy D1 resource name kept intentionally; do not rename without a data migration plan.
database_name = "cfchat-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

[[kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_KV_NAMESPACE_ID_HERE"

[[kv_namespaces]]
# 复用与 SESSIONS 相同的 KV namespace：CI 只替换 YOUR_KV_NAMESPACE_ID_HERE，
# 用同一个占位符可确保部署时占位符被正确替换，避免 "namespace id not valid" 部署失败。
# 临时注册令牌与会话 token 的 key 前缀不同，不会冲突。
binding = "OAUTH_TEMP"
id = "YOUR_KV_NAMESPACE_ID_HERE"

[[r2_buckets]]
binding = "FILES"
# Legacy R2 bucket name kept intentionally; code/docs use Edgechat branding.
bucket_name = "cfchat-files"

[[durable_objects.bindings]]
name = "CHANNEL_ROOM"
class_name = "ChannelRoom"

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelRoom", "Scheduler"]

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/files/*"]

[triggers]
# Cloudflare Cron 按 UTC 执行；19:00 UTC = 北京时间每天 03:00
crons = ["0 19 * * *"]
